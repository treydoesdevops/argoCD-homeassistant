apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: home-assistant
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/treydoesdevops/argoCD-homeassistant
    targetRevision: HEAD
    path: apps/home-assistant
  destination:
    server: https://kubernetes.default.svc
    namespace: home
  syncPolicy:
     automated:
       prune: true
       selfHeal: true 